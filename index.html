  <!-- 3. FAQPage — rich snippet Q&As directly in Google search results -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Who is The Apex Accelerator for?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We work with ambitious high school students targeting competitive programs. Whether you're aiming for engineering, business, medicine, or another selective path, we can help you stand out."
        }
      },
      {
        "@type": "Question",
        "name": "When should I start working with The Apex Accelerator?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Ideally, students should start in Grade 10 or 11 to have time to build a compelling profile. If you start in Grade 10, for the applications phase of the program you'll take a gap year and rejoin during that phase. Starting early — in Grade 9 or 10 — gives students the most time to build meaningful experiences."
        }
      },
      {
        "@type": "Question",
        "name": "How is Apex different from traditional admissions consulting?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Most admissions consultants focus only on applications during Grade 12. Apex focuses on the development that happens before the application. Students explore interests, build projects, develop leadership experiences, and grow their personal brand so that by the time applications begin, they already have a strong and authentic story to tell."
        }
      },
      {
        "@type": "Question",
        "name": "How much does The Apex Accelerator program cost?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "The Apex Accelerator runs over two academic years. In Year 1 (Grade 10 or 11), the program runs September to June: $1,000 deposit + $438/month for 10 months. In Year 2 (Grade 12), payments continue at $438/month for 6 months (September to February). This structure spreads the investment across the program while students are actively participating."
        }
      },
      {
        "@type": "Question",
        "name": "What does the time commitment look like?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Students participate in regular workshops, mentorship sessions, and project work. Workshops are done primarily on weekends. The program is designed to fit alongside school commitments while still encouraging meaningful progress, with a lighter session load during exams."
        }
      },
      {
        "@type": "Question",
        "name": "Do students need to know what they want to study before joining?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Not at all. In fact, many students join Apex because they are still exploring their interests. A key part of the program involves exploring different fields, developing ideas, and gradually identifying areas students want to pursue more deeply."
        }
      },
      {
        "@type": "Question",
        "name": "What types of projects do students build at The Apex Accelerator?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Projects vary depending on student interests. These may include research projects, startups, community initiatives, technical builds, competitions, or leadership programs. The goal is to create meaningful experiences that reflect a student's genuine interests and initiative."
        }
      },
      {
        "@type": "Question",
        "name": "Does The Apex Accelerator guarantee university admissions?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No program can guarantee admissions outcomes. What Apex guarantees is the development process — helping students build stronger profiles, clearer direction, and more compelling applications through structured mentorship and project-building."
        }
      },
      {
        "@type": "Question",
        "name": "How selective is The Apex Accelerator program?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Students are admitted through a written application and interview process. We keep the program intentionally selective and only accept a limited number of students each cycle so we can provide close mentorship and personalized support. This allows us to build cohorts of motivated, curious students who challenge themselves alongside like-minded peers."
        }
      },
      {
        "@type": "Question",
        "name": "Can parents be involved in The Apex Accelerator process?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Parents will be kept involved throughout the entire process, receiving email updates on their child's application. Parents are always welcome to reach out over email or book a call for any questions or concerns."
        }
      }
    ]
  }
  </script>
