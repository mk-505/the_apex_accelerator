  <!-- 4. FAQPage -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Who is Apex for?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Ambitious high school students preparing for university admissions, scholarships, or both. Parents are welcome throughout, but the work is built around the student."
        }
      },
      {
        "@type": "Question",
        "name": "What grade should I be in?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "There is no single ideal grade. Apex works with students early in high school who want to build strategically, students heading into Grade 12 who need application strategy, and students actively applying. The right package depends on how far along you are."
        }
      },
      {
        "@type": "Question",
        "name": "Do I need to know what university I want to attend?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Apex can help you clarify your direction and determine what to prioritize. Narrowing that down is part of the assessment and positioning work."
        }
      },
      {
        "@type": "Question",
        "name": "Is this tutoring?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Apex focuses on application strategy, positioning, planning, and execution rather than subject tutoring. We do not teach course content or prepare students for school tests."
        }
      },
      {
        "@type": "Question",
        "name": "Do you write my essays for me?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Apex helps students develop and communicate their own ideas, and provides feedback and editing support where it is included in the package. The writing stays the student's."
        }
      },
      {
        "@type": "Question",
        "name": "Do you guarantee admission or scholarships?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. Admissions and scholarships are ultimately determined by universities and scholarship organizations. Apex provides strategy, preparation, resources, and feedback."
        }
      },
      {
        "@type": "Question",
        "name": "What is included in application editing?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Application editing is part of Apex Advantage ($549 CAD). It covers edits and personalized feedback on applications and essays, plus guidance through the application process. Editing follows a defined scope: the specific documents and number of revision rounds are confirmed in writing during purchase and onboarding. It is not an unlimited-edits service."
        }
      },
      {
        "@type": "Question",
        "name": "What is included in the scholarship database?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "A curated resource intended to help students identify scholarships that are relevant to their profile, program interests, and timeline. It is included with Apex Toolkit and Apex Advantage."
        }
      },
      {
        "@type": "Question",
        "name": "Can parents be involved?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Parents can join calls, ask questions, and stay informed where appropriate. The student stays at the centre of the process."
        }
      },
      {
        "@type": "Question",
        "name": "Which package should I choose?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Apex Strategy ($199 CAD) is best for students who want a clear plan. Apex Toolkit ($339 CAD) is best for students who want the plan plus resources to execute independently. Apex Advantage ($549 CAD) is best for students who want hands-on application support. A free 15-minute call can help you decide."
        }
      }
    ]
  }
  </script>
